name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Vet and test
        run: |
          go vet ./...
          go test ./...

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          REF_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          if [ "$GOOS" = "windows" ]; then
            out="dist/gitshield-${GOOS}-${GOARCH}.exe"
          else
            out="dist/gitshield-${GOOS}-${GOARCH}"
          fi
          # REF_NAME is the pushed tag (e.g. "v0.1.0") on a real release;
          # -X main.version bakes it into the binary (v-stripped) so
          # `gitshield version` and the update/auto-update comparisons
          # always match the tag — nobody has to hand-bump a version
          # constant before cutting a release.
          version="${REF_NAME#v}"
          go build -trimpath -ldflags="-s -w -X main.version=${version}" -o "$out" ./cmd/gitshield
          if [ "$GOOS" = "windows" ]; then
            (cd dist && zip "gitshield-${GOOS}-${GOARCH}.zip" "gitshield-${GOOS}-${GOARCH}.exe")
            (cd dist && shasum -a 256 "gitshield-${GOOS}-${GOARCH}.zip" > "gitshield-${GOOS}-${GOARCH}.zip.sha256")
          else
            tar -C dist -czf "dist/gitshield-${GOOS}-${GOARCH}.tar.gz" "gitshield-${GOOS}-${GOARCH}"
            (cd dist && shasum -a 256 "gitshield-${GOOS}-${GOARCH}.tar.gz" > "gitshield-${GOOS}-${GOARCH}.tar.gz.sha256")
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: gitshield-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
