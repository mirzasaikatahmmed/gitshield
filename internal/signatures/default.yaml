version: 1
updated: "2026-08-27"
signatures:
  # --- Exact known-campaign IOCs (source: https://saikat.com.bd/blog/github-config-malware-prevention) ---
  - id: campaign-id-a8-974-3
    kind: string
    pattern: "A8-974-3"
    description: "Known campaign identifier string"
    exact: true

  - id: campaign-id-a8-5741
    kind: string
    pattern: "A8-5741"
    description: "Known campaign identifier string (variant observed in the wild, Aug 2026)"
    exact: true

  - id: campaign-id-a8-regex
    kind: regex
    pattern: "A8-\\d{4}-\\d"
    description: "Campaign identifier pattern (A8-####-# family)"
    exact: true

  # --- PolinRider campaign (source: https://github.com/OpenSourceMalware/PolinRider) ---
  - id: polinrider-primary-sig
    kind: string
    pattern: '("rmcej%otb%",2857687)'
    description: "PolinRider packed payload primary signature"
    exact: true

  - id: polinrider-secondary-sig
    kind: string
    pattern: "global['!']='8-270-2'"
    description: "PolinRider campaign identifier assignment (global['!']='8-270-2')"
    exact: true

  - id: polinrider-campaign-id
    kind: string
    pattern: "8-270-2"
    description: "PolinRider campaign identifier string"
    exact: true

  - id: global-i-assignment
    kind: string
    pattern: "global.i="
    description: "Malware runtime global assignment (global.i=)"
    exact: true

  - id: global-underscore-v
    kind: string
    pattern: "global._V"
    description: "Malware runtime global assignment (global._V)"
    exact: true

  - id: global-underscore-h
    kind: string
    pattern: "global._H"
    description: "Malware runtime global assignment (global._H)"
    exact: true

  - id: global-underscore-h2
    kind: string
    pattern: "global._H2"
    description: "Malware runtime global assignment (global._H2)"
    exact: true

  - id: packed-footer-tgw
    kind: string
    pattern: "Tgw(2509);return 1358"
    description: "Known packed/obfuscated payload footer signature"
    exact: true

  - id: packed-footer-jfd
    kind: string
    pattern: "jFD(LQI,pYd"
    description: "Known packed/obfuscated payload footer signature"
    exact: true

  - id: packed-footer-ejd
    kind: string
    pattern: "Ejd(9255);return 4658"
    description: "Known packed/obfuscated payload footer signature"
    exact: true

  - id: payload-marker-cls
    kind: string
    pattern: "/0x/cls"
    description: "Known payload marker path"
    exact: true

  - id: payload-marker-cl
    kind: string
    pattern: "/0x/cl"
    description: "Known payload marker path (variant without trailing s)"
    exact: true

  - id: payload-marker-ls
    kind: string
    pattern: "/0x/ls"
    description: "Known payload marker path"
    exact: true

  - id: payload-marker-x-payload
    kind: string
    pattern: "x-payload-"
    description: "Known base64 payload transport header/marker (partial)"
    exact: true

  - id: c2-eth-address-fragment
    kind: string
    pattern: "6f0121063e"
    description: "Known C2 resolver Ethereum address fragment (obfuscated payloads split this across string tables)"
    exact: true

  - id: worm-batch-auto-push
    kind: string
    pattern: "temp_auto_push.bat"
    description: "Worm propagation artifact (temp_auto_push.bat)"
    exact: true

  - id: worm-batch-interactive-push
    kind: string
    pattern: "temp_interactive_push.bat"
    description: "Worm propagation artifact (temp_interactive_push.bat)"
    exact: true

  - id: worm-batch-config-bat
    kind: string
    pattern: "config.bat"
    description: "PolinRider hidden orchestrator batch file (config.bat)"
    exact: true

  - id: c2-eth-address-known
    kind: string
    pattern: "0xa322E5f3D311D3080e6f0121063e9aDC2490Ef1a"
    description: "Known C2 resolver Ethereum address for this campaign"
    exact: true

  - id: payload-header-b64
    kind: string
    pattern: "x-payload-b64"
    description: "Known base64 payload transport header/marker"
    exact: true

  # --- Heuristics (fuzzy, contribute to MODERATE/HIGH via count thresholds) ---
  - id: heuristic-long-line
    kind: heuristic
    heuristic: long-line
    description: "Line exceeding ~2000 chars in a target config file (packed/obfuscated payload signal)"
    exact: false

  - id: heuristic-spawn-detached-eval
    kind: heuristic
    heuristic: spawn-detached-eval
    description: "child_process spawn with detached:true combined with eval or dynamic require/import of remote content"
    exact: false

  - id: heuristic-eth-address
    kind: heuristic
    heuristic: eth-address
    description: "Ethereum-address-like string (0x + 40 hex chars) in a config file with no legitimate reason to reference one"
    exact: false

  - id: heuristic-gitignore-worm-marker
    kind: heuristic
    heuristic: gitignore-worm-marker
    description: ".gitignore references worm self-exclusion batch files (temp_auto_push.bat, temp_interactive_push.bat, config.bat)"
    exact: false
