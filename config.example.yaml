# Example ~/.gitshield/config.yaml
# Copy to ~/.gitshield/config.yaml and edit. Every field is optional — an
# absent file (or missing field) falls back to gitshield's shipped defaults.

# Repos you explicitly trust and want gitshield to skip scanning entirely.
# Never populated by default. Matched against the clone URL (for `clone`)
# or the repo's `origin` remote URL / local path (for `pull`).
allowlist: []
# allowlist:
#   - https://github.com/your-org/your-trusted-repo.git
#   - /home/you/code/your-local-trusted-repo

# Tune how many heuristic hits in a single file escalate MODERATE -> HIGH.
# Any exact known-IOC match is always HIGH regardless of this setting.
severity:
  high_heuristic_count: 2

# Additional signatures merged on top of the embedded default set, inline.
signatures:
  version: 1
  updated: "2026-08-27"
  signatures: []
  # signatures:
  #   - id: my-org-custom-campaign-id
  #     kind: string
  #     pattern: "SOME-NEW-CAMPAIGN-ID"
  #     description: "Campaign ID reported by our SOC"
  #     exact: true

# Or point at a separate signatures file instead of/in addition to inline
# `signatures:` above. Note: ~/.gitshield/signatures.yaml — the file
# `gitshield update-signatures` writes to, manually or automatically — is
# ALWAYS merged in too if present, even without setting this.
# signatures_file: ~/.gitshield/custom-signatures.yaml

# Where `gitshield update-signatures` fetches the latest signature set from.
# Both <url> and <url>.sig (a hex-encoded ed25519 signature of <url>'s
# bytes) must be reachable; the update is refused if verification fails.
# Also gates automatic signature updates (see disable_auto_update below) —
# gitshield never contacts an unpinned source on its own.
# update_signatures_url: "https://raw.githubusercontent.com/your-org/gitshield-signatures/main/signatures.yaml"

# ed25519 public key (64 hex chars) used to verify update_signatures_url.
# Required for `gitshield update-signatures` to run at all — an
# unauthenticated update mechanism would itself be a supply-chain risk.
# update_signatures_pubkey: "..."

# clone/pull/scan check at most once every 24h whether a newer gitshield
# release or (if update_signatures_url/pubkey are set above) IOC signature
# set is available, and apply it automatically when online — silent,
# best-effort, never blocks the command. Set true to opt out persistently;
# --no-auto-update opts out for a single run instead.
disable_auto_update: false

# Ships this machine's ~/.gitshield/audit.log to a gitshield-dashboard
# instance in the background (at most once every ~15 min, after
# clone/pull/add), so its scan history shows up there. Zero setup beyond
# this line — gitshield generates its own per-machine key locally and
# self-registers on first ingest. Off by default; --no-auto-update also
# skips this for a single run.
# dashboard_url: "https://gitshield.saikat.com.bd"
